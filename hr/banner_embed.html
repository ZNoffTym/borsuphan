<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ฝ่ายบริหารงานบุคคล โรงเรียนบ่อสุพรรณวิทยา</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;font-family:'Sarabun',sans-serif;background:#0a1628;}

.banner{
  width:100%;
  background:linear-gradient(135deg,#0a1628 0%,#1a3058 40%,#0d2040 70%,#081525 100%);
  position:relative;
  overflow:hidden;
}
.banner::before{
  content:'';position:absolute;top:0;left:0;right:0;
  height:clamp(3px,0.5vw,5px);
  background:linear-gradient(90deg,#8B6914,#D4A830,#F0C842,#D4A830,#8B6914);
  z-index:5;
}
.banner::after{
  content:'';position:absolute;bottom:0;left:0;right:0;
  height:clamp(3px,0.5vw,5px);
  background:linear-gradient(90deg,#8B6914,#D4A830,#F0C842,#D4A830,#8B6914);
  z-index:5;
}
.bg-pattern{
  position:absolute;inset:0;opacity:0.04;
  background-image:repeating-linear-gradient(45deg,#D4A830 0,#D4A830 1px,transparent 0,transparent 50%),repeating-linear-gradient(-45deg,#D4A830 0,#D4A830 1px,transparent 0,transparent 50%);
  background-size:clamp(20px,4vw,50px) clamp(20px,4vw,50px);
}
.corner{position:absolute;width:clamp(24px,3.5vw,50px);height:clamp(24px,3.5vw,50px);border-color:rgba(212,168,48,0.5);border-style:solid;z-index:4;top:clamp(8px,1.5vw,20px);}
.corner.tl{left:clamp(8px,1.5vw,20px);border-width:2px 0 0 2px;}
.corner.tr{right:clamp(8px,1.5vw,20px);border-width:2px 2px 0 0;}

/* HEADER */
.header{
  display:flex;align-items:center;justify-content:center;
  gap:clamp(10px,2vw,28px);
  padding:clamp(14px,2.5vw,32px) clamp(20px,4vw,60px) clamp(10px,2vw,20px);
  border-bottom:1px solid rgba(212,168,48,0.3);
  position:relative;z-index:2;
}
.logo-wrap{
  width:clamp(56px,8vw,110px);
  height:clamp(56px,8vw,110px);
  border-radius:50%;
  padding:clamp(2px,0.3vw,4px);
  background:linear-gradient(135deg,#D4A830,#F0C842,#D4A830);
  flex-shrink:0;
  box-shadow:0 0 clamp(8px,1.5vw,24px) rgba(212,168,48,0.45);
}
.logo-wrap img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;}
.title-block{text-align:center;}
.school-name{
  font-size:clamp(13px,2.2vw,26px);
  font-weight:600;color:#D4A830;
  letter-spacing:0.3px;
  text-shadow:0 2px 8px rgba(212,168,48,0.3);
}
.division-name{
  font-size:clamp(18px,3.5vw,42px);
  font-weight:700;color:#fff;
  letter-spacing:0.5px;margin-top:clamp(2px,0.4vw,6px);
  text-shadow:0 2px 14px rgba(0,0,0,0.5);
}
.division-en{
  font-size:clamp(9px,1vw,13px);
  font-weight:400;color:rgba(212,168,48,0.8);
  letter-spacing:2px;text-transform:uppercase;
  margin-top:clamp(1px,0.2vw,3px);
}
.gold-line{
  width:clamp(80px,14vw,220px);height:2px;
  background:linear-gradient(90deg,transparent,#D4A830,transparent);
  margin:clamp(4px,0.6vw,8px) auto 0;
}

/* PEOPLE ROW */
.people-row{
  display:flex;justify-content:center;align-items:flex-end;
  gap:0;padding:0 clamp(8px,2vw,30px);
  position:relative;z-index:2;
}
.person-card{
  display:flex;flex-direction:column;align-items:center;
  flex:1;max-width:clamp(120px,22vw,320px);
}
.person-card.center{
  flex:1.2;max-width:clamp(140px,26vw,380px);
}
.photo-wrap{
  width:100%;
  padding-top:140%; /* 1:1.4 aspect ratio */
  position:relative;overflow:hidden;
}
.person-card.center .photo-wrap{
  padding-top:145%;
}
.photo-wrap img{
  position:absolute;top:0;left:0;
  width:100%;height:100%;
  object-fit:cover;object-position:top center;
  display:block;
}
.photo-wrap::after{
  content:'';position:absolute;bottom:0;left:0;right:0;
  height:35%;
  background:linear-gradient(transparent,#0d1e3a 90%);
}
.name-plate{
  background:rgba(8,18,35,0.88);
  border:1px solid rgba(212,168,48,0.5);
  border-radius:clamp(4px,0.8vw,10px);
  padding:clamp(5px,1vw,12px) clamp(8px,1.5vw,20px);
  text-align:center;
  margin-top:-clamp(4px,0.8vw,10px);
  position:relative;z-index:3;
  width:92%;
}
.name-plate .role{
  font-size:clamp(9px,1vw,13px);
  font-weight:500;color:#D4A830;
  letter-spacing:0.3px;margin-bottom:2px;
}
.name-plate .name{
  font-size:clamp(11px,1.3vw,17px);
  font-weight:600;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ===== RESPONSIVE ===== */
@media(max-width:600px){
  .people-row{flex-wrap:wrap;gap:10px;padding:8px;justify-content:center;}
  .person-card,.person-card.center{max-width:45%;flex:0 0 45%;}
  .division-en{display:none;}
}
@media(max-width:380px){
  .person-card,.person-card.center{max-width:100%;flex:0 0 100%;}
}
</style>
</head>
